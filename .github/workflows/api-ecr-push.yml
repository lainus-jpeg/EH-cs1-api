name: Build and Push API to ECR

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY: monitoring-apps-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          role-session-name: github-actions-ecr-push
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        working-directory: .
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update SSM Parameter with new image URI
        if: github.event_name == 'push'
        run: |
          aws ssm put-parameter \
            --name "/apps/api/image-uri" \
            --value "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --type "String" \
            --overwrite \
            --region ${{ secrets.AWS_REGION }}

      - name: Trigger ASG instance refresh
        if: github.event_name == 'push'
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "ASG-api" \
            --region ${{ secrets.AWS_REGION }} || echo "Instance refresh triggered or already in progress"

      - name: Print image URI
        if: github.event_name == 'push'
        run: |
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Latest: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "SSM Parameter updated: /apps/api/image-uri"
          echo "ASG instance refresh triggered: ASG-api"

      - name: Run tests (optional)
        if: github.event_name == 'pull_request'
        run: |
          npm install
          npm test || true
