stages:
  - build
  - deploy

# Build Docker image
build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
    - echo "Backend Docker image built and pushed successfully"
    - echo "Image: $DOCKER_IMAGE"
    - echo "Latest: $DOCKER_IMAGE_LATEST"
  only:
    - main
    - master

# Deploy to container registry
deploy:
  image: alpine:latest
  stage: deploy
  script:
    - echo "✅ Backend Docker image deployed"
    - echo "Registry: $CI_REGISTRY_IMAGE"
    - echo "Tag: $CI_COMMIT_SHORT_SHA"
    - echo ""
    - echo "To pull and run locally:"
    - echo "docker pull $CI_REGISTRY_IMAGE:latest"
    - echo "docker run -p 3000:3000 \\"
    - echo "  -e DB_SERVER=your-server.database.windows.net \\"
    - echo "  -e DB_USER=your-user \\"
    - echo "  -e DB_PASSWORD=your-password \\"
    - echo "  -e DB_NAME=your-database \\"
    - echo "  $CI_REGISTRY_IMAGE:latest"
  only:
    - main
    - master
