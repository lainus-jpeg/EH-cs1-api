image: docker:24.0

services:
  - docker:24.0-dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

stages:
  - build

before_script:
  - docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" -p "$ACR_PASSWORD"

build_backend:
  stage: build
  script:
    - docker build -t "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG" -t "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:latest" fonteyn-backend
    - docker push "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:$IMAGE_TAG"
    - docker push "$ACR_LOGIN_SERVER/$ACR_REPOSITORY:latest"
  only:
    - main
